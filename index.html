<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="071のSPACE - 一个现代化的个人主页，展示创意与技术的结合。" />
    <meta name="keywords" content="个人主页, 罗小黑, 玻璃态, 动画, 技术展示" />
    <meta name="author" content="071" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>071のSPACE</title>
    <style>
      /* 轻量加载占位，避免抢占布局高度 */
      .loading {
        font-size: 1.5rem;
        color: #2a9d8f;
        animation: fadeIn 1.5s infinite;
        text-align: center;
        padding: 40px;
      }

      @keyframes fadeIn {
        0%, 100% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">加载中...</div>
    </div>
    <!-- 纸张褶皱SVG滤镜定义，全局可用 -->
    <svg width="0" height="0" style="position:absolute">
      <filter id="paperWrinkle">
        <feTurbulence type="fractalNoise" baseFrequency="0.06 0.15" numOctaves="3" seed="7" result="turb"/>
        <feDisplacementMap in2="turb" in="SourceGraphic" scale="4" xChannelSelector="R" yChannelSelector="G"/>
        <feGaussianBlur stdDeviation="0.3"/>
        <feComponentTransfer>
          <feFuncA type="linear" slope="0.98"/>
        </feComponentTransfer>
      </filter>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
